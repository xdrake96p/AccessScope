<script>
        // Micro-interaction for the star buttons
        document.querySelectorAll('button.material-symbols-outlined').forEach(btn => {
            if (btn.innerText === 'star') {
                btn.addEventListener('click', (e) => {
                    const isFilled = btn.style.fontVariationSettings.includes("'FILL' 1");
                    if (isFilled) {
                        btn.style.fontVariationSettings = "'FILL' 0";
                        btn.classList.remove('text-tertiary-container');
                        btn.classList.add('text-outline-variant');
                    } else {
                        btn.style.fontVariationSettings = "'FILL' 1";
                        btn.classList.remove('text-outline-variant');
                        btn.classList.add('text-tertiary-container');
                    }
                    btn.classList.add('scale-125');
                    setTimeout(() => btn.classList.remove('scale-125'), 200);
                });
            }
        });

        // Search highlight interaction
        const searchInput = document.querySelector('input');
        searchInput.addEventListener('focus', () => {
            searchInput.parentElement.classList.add('scale-[1.01]');
        });
        searchInput.addEventListener('blur', () => {
            searchInput.parentElement.classList.remove('scale-[1.01]');
        });
    </script>
