name: Release AccessScope APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "ERROR: Release tag must point to a commit on main."
            echo "Merge develop into main before tagging. See .cursor/rules/git-release-workflow.mdc"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run JVM tests (includes real Maestro CLI syntax gate)
        run: ./gradlew testDebugUnitTest

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          cat > keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=${RELEASE_KEYSTORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          keyPassword=${RELEASE_KEY_PASSWORD}
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Build plugin artifacts
        run: |
          cd access-scope-plugin
          ./gradlew :cli:fatJar :android-studio-plugin:buildPlugin
          PLUGIN_VERSION=$(grep '^version' android-studio-plugin/build.gradle.kts | head -1 | sed 's/.*= "\(.*\)".*/\1/')
          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> "$GITHUB_ENV"
          cp cli/build/libs/cli-*-all.jar vscode-extension/bin/AccessScope-cli.jar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package VS Code extension
        run: |
          cd access-scope-plugin/vscode-extension
          npm ci
          npm run package
          VSIX_NAME="AccessScope-${PLUGIN_VERSION}.vsix"
          mv *.vsix "../$VSIX_NAME"

      - name: Read version from APK metadata
        id: version
        run: |
          VERSION_NAME=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep versionCode app/build.gradle.kts | head -1 | sed 's/.*= //')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare release artifacts
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="access-scope-${{ steps.version.outputs.name }}.apk"
          cp "$APK_SRC" "$APK_NAME"
          SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "$TAG_NAME" = "" ] || [ "$TAG_NAME" = "${GITHUB_REF}" ]; then
            TAG_NAME="v${{ steps.version.outputs.name }}"
          fi
          cat > release-manifest.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "apkFileName": "$APK_NAME",
            "sha256": "$SHA256",
            "minPluginVersion": "${PLUGIN_VERSION}"
          }
          EOF
          cp "access-scope-plugin/android-studio-plugin/build/distributions/AccessScope-${PLUGIN_VERSION}.zip" .
          cp "access-scope-plugin/AccessScope-${PLUGIN_VERSION}.vsix" .
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: AccessScope ${{ steps.version.outputs.name }}
          files: |
            access-scope-${{ steps.version.outputs.name }}.apk
            release-manifest.json
            AccessScope-${{ env.PLUGIN_VERSION }}.zip
            AccessScope-${{ env.PLUGIN_VERSION }}.vsix
          generate_release_notes: true
