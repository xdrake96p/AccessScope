name: Release AccessScope APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Build IDE plugin artifacts
        run: |
          cd access-scope-plugin
          chmod +x gradlew
          ./gradlew :cli:fatJar :android-studio-plugin:buildPlugin
          cd vscode-extension
          npm ci
          npm run compile
          npx --yes @vscode/vsce package --no-dependencies

      - name: Read version from APK metadata
        id: version
        run: |
          VERSION_NAME=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep versionCode app/build.gradle.kts | head -1 | sed 's/.*= //')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare release artifacts
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="access-scope-${{ steps.version.outputs.name }}.apk"
          cp "$APK_SRC" "$APK_NAME"
          SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "$TAG_NAME" = "" ] || [ "$TAG_NAME" = "${GITHUB_REF}" ]; then
            TAG_NAME="v${{ steps.version.outputs.name }}"
          fi
          cat > release-manifest.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "apkFileName": "$APK_NAME",
            "sha256": "$SHA256",
            "minPluginVersion": "1.0.0"
          }
          EOF
          cp access-scope-plugin/cli/build/libs/cli-1.0.0-all.jar access-scope-cli.jar
          cp access-scope-plugin/android-studio-plugin/build/distributions/android-studio-plugin-1.0.0.zip .
          cp access-scope-plugin/vscode-extension/access-scope-1.0.0.vsix .
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: AccessScope ${{ steps.version.outputs.name }}
          files: |
            access-scope-${{ steps.version.outputs.name }}.apk
            release-manifest.json
            access-scope-cli.jar
            android-studio-plugin-1.0.0.zip
            access-scope-1.0.0.vsix
          generate_release_notes: true
