name: Release AccessScope APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "ERROR: Release tag must point to a commit on main."
            echo "Merge develop into main before tagging. See .cursor/rules/git-release-workflow.mdc"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Read version from APK metadata
        id: version
        run: |
          VERSION_NAME=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep versionCode app/build.gradle.kts | head -1 | sed 's/.*= //')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare release artifacts
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="access-scope-${{ steps.version.outputs.name }}.apk"
          cp "$APK_SRC" "$APK_NAME"
          SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "$TAG_NAME" = "" ] || [ "$TAG_NAME" = "${GITHUB_REF}" ]; then
            TAG_NAME="v${{ steps.version.outputs.name }}"
          fi
          cat > release-manifest.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "apkFileName": "$APK_NAME",
            "sha256": "$SHA256",
            "minPluginVersion": "1.0.0"
          }
          EOF
          cp access-scope-plugin/releases/1.0.0/access-scope-cli.jar .
          cp access-scope-plugin/releases/1.0.0/android-studio-plugin-1.0.0.zip .
          cp access-scope-plugin/releases/1.0.0/access-scope-1.0.0.vsix .
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: AccessScope ${{ steps.version.outputs.name }}
          files: |
            access-scope-${{ steps.version.outputs.name }}.apk
            release-manifest.json
            access-scope-cli.jar
            android-studio-plugin-1.0.0.zip
            access-scope-1.0.0.vsix
          generate_release_notes: true
